
name: Postman API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select the test environment"
        required: true
        type: choice
        default: QA
        options:
          - QA
          - Staging

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Select Environment
        run: |
          if [ "${{ inputs.environment }}" = "Staging" ]; then
            echo "ENV_FILE=Staging_Environment.postman_environment.json" >> $GITHUB_ENV
          else
            echo "ENV_FILE=QA_Environment.postman_environment.json" >> $GITHUB_ENV
          fi

      - name: Run Postman API Tests
        run: |
          mkdir -p reports
          newman run collections/Postman_API_Automation.postman_collection.json \
            -e environments/$ENV_FILE \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/API_Test_Report.html

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postman-API-Test-Report
          path: reports/API_Test_Report.html
          if-no-files-found: ignore
