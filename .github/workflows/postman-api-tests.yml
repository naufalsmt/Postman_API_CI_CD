
name: Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman API Tests
        run: |
          mkdir -p reports
          newman run collections/Postman_API_Automation.postman_collection.json \
            -e environments/QA_Environment.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/API_Test_Report.html

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postman-API-Test-Report
          path: reports/API_Test_Report.html
          if-no-files-found: ignore
